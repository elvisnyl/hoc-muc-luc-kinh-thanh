<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mục Lục Kinh Thánh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap');
        
        body {
            font-family: 'Lora', serif;
            background-color: #dad5c9; /* Màu nền vintage */
            color: #55463c; /* Màu chữ nâu tối */
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        .fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Ẩn thanh cuộn nhưng vẫn cuộn được */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }

        /* Hiệu ứng lật thẻ */
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
    </style>
</head>
<body>
    <div id="app" class="min-h-screen flex flex-col pb-24"></div>

            { id: 31, name: 'Áp-đia', group: 'Tiểu tiên tri', testament: 'Cựu Ước', icon: 'star' },

            { id: 36, name: 'Sô-phô-ni', group: 'Tiểu tiên tri', testament: 'Cựu Ước', icon: 'star' },

            { id: 41, name: 'Mác', group: 'Phúc âm', testament: 'Tân Ước', icon: 'cross' },

            { id: 44, name: 'Công Vụ Các Sứ Đồ', group: 'Lịch sử', testament: 'Tân Ước', icon: 'map' },

            { id: 47, name: 'II Cô-rinh-tô', group: 'Thư Phao-lô gửi các Hội thánh', testament: 'Tân Ước', icon: 'message-circle' },
            { id: 48, name: 'Ga-la-ti', group: 'Thư Phao-lô gửi các Hội thánh', testament: 'Tân Ước', icon: 'message-circle' },
            { id: 49, name: 'Ê-phê-sô', group: 'Thư Phao-lô gửi các Hội thánh', testament: 'Tân Ước', icon: 'message-circle' },
            { id: 50, name: 'Phi-líp', group: 'Thư Phao-lô gửi các Hội thánh', testament: 'Tân Ước', icon: 'message-circle' },
            { id: 51, name: 'Cô-lô-se', group: 'Thư Phao-lô gửi các Hội thánh', testament: 'Tân Ước', icon: 'message-circle' },
            { id: 52, name: 'I Tê-sa-lô-ni-ca', group: 'Thư Phao-lô gửi các Hội thánh', testament: 'Tân Ước', icon: 'message-circle' },
            { id: 53, name: 'II Tê-sa-lô-ni-ca', group: 'Thư Phao-lô gửi các Hội thánh', testament: 'Tân Ước', icon: 'message-circle' },
            { id: 54, name: 'I Ti-mô-thê', group: 'Thư Phao-lô gửi cá nhân', testament: 'Tân Ước', icon: 'message-circle' },
            { id: 55, name: 'II Ti-mô-thê', group: 'Thư Phao-lô gửi cá nhân', testament: 'Tân Ước', icon: 'message-circle' },
            { id: 56, name: 'Tít', group: 'Thư Phao-lô gửi cá nhân', testament: 'Tân Ước', icon: 'message-circle' },
            { id: 57, name: 'Phi-lê-môn', group: 'Thư Phao-lô gửi cá nhân', testament: 'Tân Ước', icon: 'message-circle' },
            { id: 58, name: 'Hê-bơ-rơ', group: 'Thư tín chung', testament: 'Tân Ước', icon: 'message-circle' },
            { id: 59, name: 'Gia-cơ', group: 'Thư tín chung', testament: 'Tân Ước', icon: 'message-circle' },
            { id: 60, name: 'I Phi-e-rơ', group: 'Thư tín chung', testament: 'Tân Ước', icon: 'message-circle' },
            { id: 61, name: 'II Phi-e-rơ', group: 'Thư tín chung', testament: 'Tân Ước', icon: 'message-circle' },
            { id: 62, name: 'I Giăng', group: 'Thư tín chung', testament: 'Tân Ước', icon: 'message-circle' },
            { id: 63, name: 'II Giăng', group: 'Thư tín chung', testament: 'Tân Ước', icon: 'message-circle' },
            { id: 64, name: 'III Giăng', group: 'Thư tín chung', testament: 'Tân Ước', icon: 'message-circle' },
            { id: 65, name: 'Giu-đe', group: 'Thư tín chung', testament: 'Tân Ước', icon: 'message-circle' },
            { id: 66, name: 'Khải Huyền', group: 'Tiên tri', testament: 'Tân Ước', icon: 'flame' }
        ];

        const GROUP_ORDER = [
            'Luật pháp', 'Lịch sử', 'Thi ca & Khôn ngoan', 'Đại Tiên tri', 'Tiểu tiên tri',
            'Phúc âm', 'Thư Phao-lô gửi các Hội thánh', 'Thư Phao-lô gửi cá nhân', 'Thư tín chung', 'Tiên tri'
        ];

        const getGroupColor = (group, testament) => {
            if (group === 'Luật pháp') return 'bg-[#cde4fb] text-[#2c4e70]';
            if (group === 'Lịch sử' && testament === 'Cựu Ước') return 'bg-[#ffe4b5] text-[#7a5c1e]';
            if (group === 'Lịch sử' && testament === 'Tân Ước') return 'bg-[#cde4fb] text-[#2c4e70]';
            if (group === 'Thi ca & Khôn ngoan') return 'bg-[#ffcdd2] text-[#8a333b]';
            if (group === 'Đại Tiên tri') return 'bg-[#b2ebf2] text-[#1c6b75]';
            if (group === 'Tiểu tiên tri') return 'bg-[#dcedc8] text-[#4d702d]';
            if (group === 'Phúc âm') return 'bg-[#ffcc80] text-[#85510c]';
            if (group === 'Thư Phao-lô gửi các Hội thánh') return 'bg-[#dcedc8] text-[#4d702d]';
            if (group === 'Thư Phao-lô gửi cá nhân') return 'bg-[#ffcdd2] text-[#8a333b]';
            if (group === 'Thư tín chung') return 'bg-[#dcedc8] text-[#4d702d]';
            if (group === 'Tiên tri') return 'bg-[#b2ebf2] text-[#1c6b75]';
            return 'bg-[#e3dac9] text-[#55463c]';
        };

        // --- STREAMING_CHUNK:Audio Setup ---
        const playAudio = (text) => {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'vi-VN';
            utterance.rate = 0.85; 

            const setVoiceAndSpeak = () => {
                const voices = window.speechSynthesis.getVoices();
                const viVoices = voices.filter(v => v.lang.includes('vi'));
                const southernVoice = viVoices.find(v => 
                    v.name.toLowerCase().includes('nam') || 
                    v.name.toLowerCase().includes('ho chi minh') ||
                    v.name.toLowerCase().includes('southern')
                );

                if (southernVoice) utterance.voice = southernVoice;
                else if (viVoices.length > 0) utterance.voice = viVoices[0];
                window.speechSynthesis.speak(utterance);
            };

            if (window.speechSynthesis.getVoices().length === 0) {
                window.speechSynthesis.addEventListener('voiceschanged', setVoiceAndSpeak, { once: true });
            } else {
                setVoiceAndSpeak();
            }
        };

        // --- STREAMING_CHUNK:State Management ---
        let currentView = 'home';
        let userName = localStorage.getItem('bible_userName') || '';
        
        const setUserName = (val) => {
            userName = val;
            localStorage.setItem('bible_userName', val);
        };
        
        // Learn State
        let learnActiveTab = 'Cựu Ước';

        // Test State
        let testLevel = null;
        let testOptions = [];
        let testTargetOrder = [];
        let testSelectedOrder = [];
        let testIsCorrect = null;
        let testStreak = 0;
        let testScored = false;

        // Flashcard State
        let fcFilter = 'ALL';
        let fcIndex = 0;
        let fcIsFlipped = false;

        const setView = (view) => {
            currentView = view;
            if (view !== 'test') { testLevel = null; testStreak = 0; }
            if (view !== 'flashcard') { fcIndex = 0; fcIsFlipped = false; }
            render();
        };

        // --- STREAMING_CHUNK:Home View ---
        const getHomeHTML = () => `
            <div class="flex flex-col items-center justify-center mt-6 md:mt-12 space-y-10 fade-in px-4">
                <div class="text-center max-w-xl mx-auto space-y-4">
                    <h2 class="text-4xl md:text-5xl font-bold text-[#4a3b32] leading-tight">
                        Cùng nhau thuộc lòng <br/> 66 sách Kinh Thánh.
                    </h2>
                    <p class="text-lg md:text-xl text-[#6A5A48] leading-relaxed px-2">
                        Từng sách một, từng nhóm một — <br class="hidden md:block" /> cùng học, cùng ôn và cùng ghi nhớ.
                    </p>
                    
                    <div class="pt-4 pb-2 w-full max-w-sm mx-auto">
                        <input type="text" 
                               value="${userName}" 
                               onkeyup="setUserName(this.value)" 
                               onchange="setUserName(this.value)"
                               placeholder="Nhập tên của bạn..." 
                               class="w-full bg-[#fdfbf7]/80 border-2 border-[#c5beaf] px-5 py-3.5 rounded-2xl text-center text-xl font-bold text-[#4a3b32] placeholder-[#a09788] focus:outline-none focus:border-[#d4af37] focus:bg-[#fdfbf7] focus:ring-4 focus:ring-[#d4af37]/20 shadow-inner transition-all" />
                        <p class="text-xs text-[#a09788] mt-2 italic">Tên sẽ xuất hiện trên bảng thành tích của bạn</p>
                    </div>

                    <div class="pt-4">
                        <button onclick="setView('learn')" class="bg-[#55463c] text-[#fdfbf7] px-10 py-4 md:px-12 md:py-5 rounded-full text-xl md:text-2xl font-bold shadow-lg hover:shadow-xl hover:-translate-y-1 transition-all">
                            Bắt đầu học →
                        </button>
                    </div>
                </div>

                <div class="flex flex-col md:flex-row gap-4 md:gap-6 w-full max-w-4xl pt-8">
                    <!-- Nút Học -->
                    <button onclick="setView('learn')" class="flex-1 group flex flex-col items-center p-6 md:p-8 bg-[#fdfbf7]/60 rounded-3xl border border-[#c5beaf] shadow-sm hover:shadow-md hover:bg-[#fdfbf7] transition-all">
                        <div class="w-16 h-16 md:w-20 md:h-20 bg-[#e3dac9] rounded-2xl flex items-center justify-center mb-4 md:mb-6 group-hover:scale-110 transition-transform shadow-inner">
                            <i data-lucide="book-open" class="w-8 h-8 md:w-10 md:h-10 text-[#55463c]"></i>
                        </div>
                        <h3 class="text-xl md:text-2xl font-bold mb-2">Học</h3>
                        <p class="text-sm md:text-base text-center text-[#7a6f65]">Khám phá và nghe cấu trúc các sách</p>
                    </button>

                    <!-- Nút Lật Thẻ -->
                    <button onclick="setView('flashcard')" class="flex-1 group flex flex-col items-center p-6 md:p-8 bg-[#fdfbf7]/60 rounded-3xl border border-[#c5beaf] shadow-sm hover:shadow-md hover:bg-[#fdfbf7] transition-all">
                        <div class="w-16 h-16 md:w-20 md:h-20 bg-[#e3dac9] rounded-2xl flex items-center justify-center mb-4 md:mb-6 group-hover:scale-110 transition-transform shadow-inner">
                            <i data-lucide="layers" class="w-8 h-8 md:w-10 md:h-10 text-[#55463c]"></i>
                        </div>
                        <h3 class="text-xl md:text-2xl font-bold mb-2">Lật thẻ</h3>
                        <p class="text-sm md:text-base text-center text-[#7a6f65]">Ôn tập và rèn phản xạ ghi nhớ</p>
                    </button>

                    <!-- Nút Kiểm tra -->
                    <button onclick="setView('test')" class="flex-1 group flex flex-col items-center p-6 md:p-8 bg-[#fdfbf7]/60 rounded-3xl border border-[#c5beaf] shadow-sm hover:shadow-md hover:bg-[#fdfbf7] transition-all">
                        <div class="w-16 h-16 md:w-20 md:h-20 bg-[#e3dac9] rounded-2xl flex items-center justify-center mb-4 md:mb-6 group-hover:scale-110 transition-transform shadow-inner">
                            <i data-lucide="layout-grid" class="w-8 h-8 md:w-10 md:h-10 text-[#55463c]"></i>
                        </div>
                        <h3 class="text-xl md:text-2xl font-bold mb-2">Kiểm tra</h3>
                        <p class="text-sm md:text-base text-center text-[#7a6f65]">Sắp xếp thứ tự để thử sức trí nhớ</p>
                    </button>
                </div>

                <div class="pt-8 md:pt-12 text-center text-[#7a6f65] px-6">
                    <p class="italic text-base md:text-lg mb-2">“Tôi sẽ suy gẫm về giềng-mối Chúa,<br class="md:hidden" /> và chăm chỉ xem xét các đường-lối Chúa.”</p>
                    <p class="font-bold text-sm md:text-base">— Thi Thiên 119:15</p>
                </div>
            </div>
        `;

        // --- STREAMING_CHUNK:Learn View ---
        const setLearnTab = (tab) => {
            learnActiveTab = tab;
            render();
        };

        const getLearnHTML = () => {
            const booksToDisplay = BIBLE_BOOKS.filter(b => b.testament === learnActiveTab);
            const groupsInTab = GROUP_ORDER.filter(g => booksToDisplay.some(b => b.group === g));

            const groupsHTML = groupsInTab.map(group => {
                const groupBooks = booksToDisplay.filter(b => b.group === group);
                const GroupIcon = groupBooks[0]?.icon || 'scroll';
                const headerColorClass = getGroupColor(group, learnActiveTab);
                
                return `
                    <div class="border border-[#c5beaf] rounded-2xl overflow-hidden shadow-sm mb-6 bg-[#fdfbf7]/60">
                        <div class="${headerColorClass} px-4 py-3 md:px-5 md:py-4 border-b border-[#c5beaf] flex items-center justify-between">
                            <div class="flex items-center space-x-3">
                                <div class="p-2 bg-white/40 rounded-xl">
                                    <i data-lucide="${GroupIcon}" class="w-5 h-5 md:w-6 md:h-6"></i>
                                </div>
                                <h3 class="text-lg md:text-xl font-bold">${group}</h3>
                                <span class="text-xs md:text-sm bg-white/40 px-2.5 py-1 rounded-full font-medium">
                                    ${groupBooks.length} sách
                                </span>
                            </div>
                            <button onclick="playAudio('${group}. ${groupBooks.map(b=>b.name).join(', ')}')"
                                    class="p-2.5 hover:bg-white/40 rounded-full transition-colors flex items-center"
                                    title="Đọc toàn bộ nhóm">
                                <i data-lucide="play-circle" class="w-6 h-6 md:w-7 md:h-7"></i>
                            </button>
                        </div>
                        
                        <div class="p-3 md:p-5 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2 md:gap-4 bg-white/20">
                            ${groupBooks.map(book => `
                                <div onclick="playAudio('${book.name}')" class="flex items-center justify-between p-3 md:p-4 rounded-xl border border-transparent hover:border-[#c5beaf] hover:bg-white/60 transition-colors group cursor-pointer">
                                    <div class="flex items-center space-x-3 md:space-x-4">
                                        <span class="text-sm md:text-base font-bold text-[#a09788] w-6 md:w-8">${book.id}</span>
                                        <span class="font-medium text-base md:text-lg text-[#4a3b32]">${book.name}</span>
                                    </div>
                                    <button class="text-[#c5beaf] group-hover:text-[#8b7967] transition-colors">
                                        <i data-lucide="volume-2" class="w-5 h-5 md:w-6 md:h-6"></i>
                                    </button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');

            return `
                <div class="fade-in max-w-4xl mx-auto w-full px-4">
                    <div class="sticky top-0 z-10 bg-[#dad5c9]/90 backdrop-blur-md py-4 md:py-6 flex flex-col items-center border-b border-[#c5beaf]/50 mb-6">
                        <div class="w-full flex justify-between items-center max-w-4xl mb-4">
                            <button onclick="setView('home')" class="flex items-center text-[#7A6A58] hover:text-[#3A2A20] transition-colors text-base md:text-lg">
                                <i data-lucide="arrow-left" class="w-5 h-5 md:w-6 md:h-6 mr-2"></i> Trở về
                            </button>
                        </div>
                        <div class="flex space-x-2 bg-[#c5beaf]/30 p-1.5 rounded-xl w-max shadow-inner">
                            ${['Cựu Ước', 'Tân Ước'].map(tab => `
                                <button onclick="setLearnTab('${tab}')"
                                        class="px-6 py-2 md:px-8 md:py-2.5 rounded-lg text-base md:text-lg font-bold transition-all ${learnActiveTab === tab ? 'bg-[#fdfbf7] text-[#4a3b32] shadow-sm' : 'text-[#7a6f65] hover:text-[#4a3b32]'}">
                                    ${tab}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                    <div>${groupsHTML}</div>
                </div>
            `;
        };

        // --- STREAMING_CHUNK:Test View Logic ---
        const startTest = (level) => {
            testLevel = level;
            testStreak = 0;
            generateQuestion(level);
        };

        const resetTestLevel = () => {
            testLevel = null;
            testStreak = 0;
            render();
        };

        const generateQuestion = (currentLevel) => {
            let pool = BIBLE_BOOKS;
            if (currentLevel === 'OT') pool = BIBLE_BOOKS.filter(b => b.testament === 'Cựu Ước');
            if (currentLevel === 'NT') pool = BIBLE_BOOKS.filter(b => b.testament === 'Tân Ước');

            const maxIndex = pool.length - 5;
            const startIndex = Math.floor(Math.random() * maxIndex);
            const correctBooks = pool.slice(startIndex, startIndex + 5);
            
            testTargetOrder = correctBooks;
            testOptions = [...correctBooks].sort(() => Math.random() - 0.5);
            testSelectedOrder = [];
            testIsCorrect = null;
            testScored = false;
            render();
        };

        let draggedBookId = null;
        let draggedFrom = null;
        let draggedIndex = null;

        const onDragStartOption = (e, bookId) => {
            draggedBookId = bookId;
            draggedFrom = 'options';
            e.dataTransfer.effectAllowed = 'move';
        };

        const onDragStartSelected = (e, bookId, index) => {
            draggedBookId = bookId;
            draggedFrom = 'selected';
            draggedIndex = index;
            e.dataTransfer.effectAllowed = 'move';
        };

        const onDragOver = (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        };

        const checkTestCompletion = () => {
            if (testSelectedOrder.length === 5) {
                testIsCorrect = testSelectedOrder.every((b, i) => b.id === testTargetOrder[i].id);
                if(testIsCorrect) {
                    playAudio("Tuyệt vời, bạn đã xếp đúng!");
                    if(!testScored) { testStreak++; testScored = true; }
                } else {
                    playAudio("Chưa chính xác, hãy thử lại.");
                    if(!testScored) { testStreak = 0; testScored = true; }
                }
            } else {
                testIsCorrect = null;
            }
        };

        const onDropSelectedArea = (e) => {
            e.preventDefault();
            if (testIsCorrect) return;

            if (draggedFrom === 'options') {
                const book = BIBLE_BOOKS.find(b => b.id === draggedBookId);
                if (!testSelectedOrder.some(b => b.id === draggedBookId)) {
                    testSelectedOrder.push(book);
                    playAudio(book.name);
                    checkTestCompletion();
                    render();
                }
            } else if (draggedFrom === 'selected') {
                const item = testSelectedOrder.splice(draggedIndex, 1)[0];
                testSelectedOrder.push(item);
                checkTestCompletion();
                render();
            }
        };

        const onDropSelectedItem = (e, targetIndex) => {
            e.preventDefault();
            e.stopPropagation(); 
            if (testIsCorrect) return;

            if (draggedFrom === 'options') {
                const book = BIBLE_BOOKS.find(b => b.id === draggedBookId);
                if (!testSelectedOrder.some(b => b.id === draggedBookId)) {
                    testSelectedOrder.splice(targetIndex, 0, book);
                    playAudio(book.name);
                    checkTestCompletion();
                    render();
                }
            } else if (draggedFrom === 'selected') {
                if (draggedIndex !== targetIndex) {
                    const item = testSelectedOrder.splice(draggedIndex, 1)[0];
                    testSelectedOrder.splice(targetIndex, 0, item);
                    checkTestCompletion();
                    render();
                }
            }
        };

        const handleTestSelect = (bookId) => {
            if (testIsCorrect) return;
            const book = BIBLE_BOOKS.find(b => b.id === bookId);
            if (testSelectedOrder.some(b => b.id === bookId)) return;
            
            testSelectedOrder.push(book);
            playAudio(book.name);
            checkTestCompletion();
            render();
        };

        const handleTestRemove = (bookId) => {
            if (testIsCorrect) return; 
            testSelectedOrder = testSelectedOrder.filter(b => b.id !== bookId);
            testIsCorrect = null;
            render();
        };

        // --- STREAMING_CHUNK:Test View Render ---
        const getTestHTML = () => {
            if (!testLevel) {
                return `
                    <div class="fade-in px-4">
                        <div class="flex items-center mb-8 md:mb-12">
                            <button onclick="setView('home')" class="flex items-center text-[#7a6f65] hover:text-[#4a3b32] transition-colors text-base md:text-lg">
                                <i data-lucide="arrow-left" class="w-5 h-5 md:w-6 md:h-6 mr-2"></i> Trở về
                            </button>
                        </div>
                        <div class="text-center mb-10 md:mb-14">
                            <h2 class="text-3xl md:text-4xl font-bold mb-3 md:mb-4">Thử sức trí nhớ</h2>
                            <p class="text-lg md:text-xl text-[#7a6f65]">Chọn vùng kiến thức bạn muốn kiểm tra</p>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6 max-w-4xl mx-auto">
                            <button onclick="startTest('OT')" class="p-6 md:p-8 bg-[#fdfbf7]/60 rounded-3xl border border-[#c5beaf] hover:border-[#8b7967] hover:bg-[#fdfbf7] hover:shadow-md transition-all flex flex-col items-center text-center">
                                <div class="text-xl md:text-2xl font-bold text-[#4a3b32] mb-2 md:mb-3">Cựu Ước</div>
                                <div class="text-sm md:text-base text-[#7a6f65]">39 sách từ Sáng Thế Ký đến Ma-la-chi</div>
                            </button>
                            <button onclick="startTest('NT')" class="p-6 md:p-8 bg-[#fdfbf7]/60 rounded-3xl border border-[#c5beaf] hover:border-[#8b7967] hover:bg-[#fdfbf7] hover:shadow-md transition-all flex flex-col items-center text-center">
                                <div class="text-xl md:text-2xl font-bold text-[#4a3b32] mb-2 md:mb-3">Tân Ước</div>
                                <div class="text-sm md:text-base text-[#7a6f65]">27 sách từ Ma-thi-ơ đến Khải Huyền</div>
                            </button>
                            <button onclick="startTest('ALL')" class="p-6 md:p-8 bg-[#fdfbf7]/60 rounded-3xl border border-[#c5beaf] hover:border-[#8b7967] hover:bg-[#fdfbf7] hover:shadow-md transition-all flex flex-col items-center text-center">
                                <div class="text-xl md:text-2xl font-bold text-[#4a3b32] mb-2 md:mb-3">Toàn bộ</div>
                                <div class="text-sm md:text-base text-[#7a6f65]">Trộn lẫn cả 66 sách Kinh Thánh</div>
                            </button>
                        </div>
                    </div>
                `;
            }

            // Streak & Message HTML string
            let msgHTML = '';
            if (testIsCorrect !== null) {
                const baseClass = testIsCorrect 
                    ? 'bg-[#7a8a65]/20 border border-[#7a8a65]/40 text-[#4c5c3c]' // Xanh rêu
                    : 'bg-[#a35d5a]/20 border border-[#a35d5a]/40 text-[#823d3a]'; // Đỏ gạch
                
                const iconHTML = testIsCorrect 
                    ? `<i data-lucide="check-circle-2" class="w-6 h-6 md:w-8 md:h-8 mr-2 md:mr-3"></i> <span class="text-lg md:text-2xl">Chính xác! Tuyệt vời.</span>` 
                    : `<i data-lucide="alert-circle" class="w-6 h-6 md:w-7 md:h-7 mr-2 md:mr-3"></i> <span class="text-base md:text-xl">Sai thứ tự rồi, hãy thử lại nhé.</span>`;

                let streakHTML = '';
                if (testIsCorrect && testStreak > 0) {
                    streakHTML = `
                        <div class="flex flex-col items-center mt-6 bg-gradient-to-b from-[#fdfbf7] to-[#f4f0e6] px-8 py-7 rounded-2xl shadow-lg border-2 border-[#eab308]/50 w-full max-w-md mx-auto relative overflow-hidden transform hover:scale-[1.02] transition-transform">
                            <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-transparent via-[#eab308] to-transparent opacity-80"></div>
                            
                            <div class="text-[#8b7967] text-xs md:text-sm uppercase tracking-widest font-bold mb-1">Thành tích xuất sắc của</div>
                            <div class="text-[#4a3b32] text-2xl md:text-3xl font-black mb-5 font-serif">${userName || 'Bạn'}</div>
                            
                            <div class="flex items-center justify-center bg-[#fdfbf7] px-8 py-3 rounded-full border border-[#eab308]/40 shadow-inner">
                                <i data-lucide="flame" class="w-10 h-10 md:w-12 md:h-12 mr-3 text-[#eab308] fill-current animate-pulse"></i> 
                                <span class="text-[#eab308] text-5xl md:text-6xl font-black drop-shadow-sm">${testStreak}</span>
                                <span class="text-[#8b7967] ml-3 text-sm md:text-base font-medium mt-3 md:mt-4 uppercase tracking-wide">chuỗi<br/>đúng</span>
                            </div>
                        </div>
                    `;
                } else if (!testIsCorrect && testScored && testStreak === 0) {
                    streakHTML = `<div class="mt-3 text-sm md:text-base opacity-80 italic font-normal text-center">Bấm vào sách bị sai để đẩy ra ngoài và thử lại. (Chuỗi bị đặt lại)</div>`;
                }

                msgHTML = `
                    <div class="mb-8 p-5 md:p-6 rounded-2xl font-bold flex flex-col items-center justify-center shadow-sm transition-all duration-300 ${baseClass}">
                        <div class="flex items-center justify-center w-full">${iconHTML}</div>
                        ${streakHTML}
                    </div>
                `;
            }

            return `
                <div class="max-w-3xl mx-auto w-full px-4">
                    <div class="flex flex-col md:flex-row md:justify-between md:items-center mb-6 md:mb-10 space-y-4 md:space-y-0">
                        <button onclick="resetTestLevel()" class="flex items-center text-[#7a6f65] hover:text-[#4a3b32] transition-colors text-base md:text-lg self-start">
                            <i data-lucide="arrow-left" class="w-5 h-5 md:w-6 md:h-6 mr-2"></i> Chọn bài khác
                        </button>
                        <div class="flex flex-wrap items-center gap-2">
                            ${testStreak > 0 ? `
                                <span class="font-bold text-[#eab308] bg-[#fdfbf7]/90 border border-[#eab308]/40 px-3 py-1.5 md:px-4 md:py-2 rounded-full text-xs md:text-sm tracking-wide flex items-center shadow-sm">
                                    <i data-lucide="flame" class="w-4 h-4 md:w-5 md:h-5 mr-1.5 fill-current text-[#eab308]"></i> Chuỗi: ${testStreak}
                                </span>
                            ` : ''}
                            <span class="font-bold text-[#55463c] bg-[#e3dac9] px-4 py-1.5 md:px-5 md:py-2 rounded-full text-xs md:text-sm uppercase tracking-wide">
                                Đang kiểm tra: ${testLevel === 'OT' ? 'Cựu Ước' : testLevel === 'NT' ? 'Tân Ước' : 'Toàn bộ'}
                            </span>
                        </div>
                    </div>

                    <div class="text-center mb-8">
                        <h3 class="text-2xl md:text-3xl font-bold text-[#4a3b32] mb-3">Sắp xếp theo đúng thứ tự</h3>
                        <p class="text-base md:text-lg text-[#7a6f65]">Nhấp hoặc kéo thả các sách bên dưới theo thứ tự xuất hiện trong Kinh Thánh.</p>
                    </div>
                    
                    <div class="flex flex-wrap justify-center gap-2 md:gap-3 min-h-[80px] p-4 md:p-6 bg-[#e3dac9]/50 rounded-2xl border-2 border-dashed border-[#c5beaf] mb-8 transition-colors"
                            ondragover="onDragOver(event)"
                            ondrop="onDropSelectedArea(event)">
                        
                        ${testSelectedOrder.length === 0 ? `<span class="text-[#a09788] italic text-base md:text-lg flex items-center justify-center w-full pointer-events-none">Chỗ trống... Kéo thả sách vào đây</span>` : ''}
                        
                        ${testSelectedOrder.map((book, idx) => {
                            let btnClass = 'bg-[#55463c] text-[#fdfbf7] hover:bg-[#40342c]'; 
                            
                            // Ẩn màu xanh/đỏ cho tới khi điền đủ 5 sách
                            if (testSelectedOrder.length === 5) {
                                const isCorrectPos = book.id === testTargetOrder[idx].id;
                                if (isCorrectPos) {
                                    btnClass = 'bg-[#7a8a65] text-[#fdfbf7] shadow-sm'; // Xanh rêu
                                } else {
                                    btnClass = 'bg-[#a35d5a] text-[#fdfbf7]'; // Đỏ gạch
                                }
                            }

                            return `
                            <button onclick="handleTestRemove(${book.id})" 
                                    draggable="${!testIsCorrect}"
                                    ondragstart="onDragStartSelected(event, ${book.id}, ${idx})"
                                    ondragover="onDragOver(event)"
                                    ondrop="onDropSelectedItem(event, ${idx})"
                                    class="px-5 py-3 md:px-6 md:py-4 rounded-xl font-medium text-base md:text-lg transition-all shadow-md flex items-center cursor-move hover:scale-105 active:scale-95 ${btnClass}">
                                <span class="mr-2.5 opacity-60 text-xs md:text-sm pointer-events-none">${idx + 1}.</span> 
                                <span class="pointer-events-none">${book.name}</span>
                            </button>
                            `;
                        }).join('')}
                    </div>

                    ${msgHTML}

                    <div class="flex flex-wrap justify-center gap-3 md:gap-4 mb-8">
                        ${testOptions.map(book => {
                            const isSelected = testSelectedOrder.some(b => b.id === book.id);
                            return `
                                <button onclick="handleTestSelect(${book.id})" 
                                        draggable="${!(isSelected || testIsCorrect !== null)}"
                                        ondragstart="onDragStartOption(event, ${book.id})"
                                        ${isSelected || testIsCorrect !== null ? 'disabled' : ''} 
                                        class="px-5 py-3 md:px-6 md:py-3.5 rounded-xl border-2 text-base md:text-lg font-bold transition-all ${isSelected ? 'bg-transparent border-transparent text-transparent opacity-0 cursor-default' : 'bg-[#fdfbf7] border-[#c5beaf] text-[#55463c] hover:border-[#8b7967] hover:bg-[#f4f0e6] shadow-sm cursor-grab active:cursor-grabbing hover:-translate-y-1'}">
                                    ${book.name}
                                </button>
                            `;
                        }).join('')}
                    </div>
                    
                    ${testIsCorrect !== null ? `
                        <div class="flex justify-center mt-8 fade-in">
                            <button onclick="generateQuestion('${testLevel}')" class="flex items-center px-8 py-4 bg-[#55463c] hover:bg-[#40342c] text-[#fdfbf7] rounded-full text-lg md:text-xl font-bold transition-all shadow-lg hover:shadow-xl hover:-translate-y-1">
                                <i data-lucide="refresh-cw" class="w-6 h-6 md:w-7 md:h-7 mr-3"></i> Câu hỏi tiếp theo
                            </button>
                        </div>
                    ` : ''}
                </div>
            `;
        };

        // --- STREAMING_CHUNK:Flashcard View ---
        const setFcFilter = (filter) => {
            fcFilter = filter;
            fcIndex = 0;
            fcIsFlipped = false;
            render();
        };

        const fcNext = (e) => {
            e.stopPropagation();
            const books = fcFilter === 'ALL' ? BIBLE_BOOKS : BIBLE_BOOKS.filter(b => b.testament === (fcFilter === 'OT' ? 'Cựu Ước' : 'Tân Ước'));
            fcIsFlipped = false;
            fcIndex = (fcIndex + 1) % books.length;
            render();
        };

        const fcPrev = (e) => {
            e.stopPropagation();
            const books = fcFilter === 'ALL' ? BIBLE_BOOKS : BIBLE_BOOKS.filter(b => b.testament === (fcFilter === 'OT' ? 'Cựu Ước' : 'Tân Ước'));
            fcIsFlipped = false;
            fcIndex = (fcIndex - 1 + books.length) % books.length;
            render();
        };

        const fcFlip = () => {
            const books = fcFilter === 'ALL' ? BIBLE_BOOKS : BIBLE_BOOKS.filter(b => b.testament === (fcFilter === 'OT' ? 'Cựu Ước' : 'Tân Ước'));
            const book = books[fcIndex];
            fcIsFlipped = !fcIsFlipped;
            if (!fcIsFlipped) {
                playAudio(`${book.name}, quyển số ${book.id}, thuộc nhóm ${book.group}, ${book.testament}`);
            } else {
                playAudio(book.name);
            }
            render();
        };

        const getFlashcardHTML = () => {
            const books = fcFilter === 'ALL' ? BIBLE_BOOKS : BIBLE_BOOKS.filter(b => b.testament === (fcFilter === 'OT' ? 'Cựu Ước' : 'Tân Ước'));
            const currentBook = books[fcIndex];
            if(!currentBook) return '';

            return `
                <div class="fade-in max-w-2xl mx-auto flex flex-col items-center px-4 w-full">
                    <div class="w-full flex flex-col md:flex-row md:items-center justify-between mb-8 md:mb-12 space-y-4 md:space-y-0">
                        <button onclick="setView('home')" class="flex items-center text-[#7a6f65] hover:text-[#4a3b32] transition-colors text-base md:text-lg">
                            <i data-lucide="arrow-left" class="w-5 h-5 md:w-6 md:h-6 mr-2"></i> Trở về
                        </button>
                        
                        <div class="flex space-x-1 md:space-x-2 bg-[#c5beaf]/30 p-1.5 rounded-xl shadow-inner mx-auto md:mx-0">
                            ${['ALL', 'OT', 'NT'].map(f => `
                                <button onclick="setFcFilter('${f}')"
                                        class="px-4 py-2 md:px-6 md:py-2.5 text-sm md:text-base rounded-lg font-bold transition-all ${fcFilter === f ? 'bg-[#fdfbf7] text-[#4a3b32] shadow-sm' : 'text-[#7a6f65] hover:text-[#4a3b32]'}">
                                    ${f === 'ALL' ? 'Tất cả' : f === 'OT' ? 'Cựu Ước' : 'Tân Ước'}
                                </button>
                            `).join('')}
                        </div>
                    </div>

                    <div class="text-sm md:text-base font-bold text-[#a09788] mb-4 md:mb-6 tracking-widest uppercase">
                        Thẻ ${fcIndex + 1} / ${books.length}
                    </div>

                    <div onclick="fcFlip()" class="w-full aspect-[4/3] sm:aspect-[3/2] md:aspect-[16/9] cursor-pointer mb-8 md:mb-12 relative perspective-1000 group">
                        <div class="absolute inset-0 w-full h-full transition-transform duration-500 transform-style-3d shadow-xl rounded-3xl ${fcIsFlipped ? 'rotate-y-180' : ''}">
                            <!-- MẶT TRƯỚC -->
                            <div class="absolute inset-0 w-full h-full bg-[#fdfbf7] border-2 border-[#c5beaf] rounded-3xl flex flex-col items-center justify-center p-6 md:p-10 backface-hidden">
                                <i data-lucide="${currentBook.icon}" class="w-16 h-16 md:w-24 md:h-24 text-[#e3dac9] mb-8 md:mb-10"></i>
                                <h2 class="text-4xl md:text-6xl font-bold text-[#4a3b32] text-center px-4 leading-tight">${currentBook.name}</h2>
                                <p class="mt-10 md:mt-12 text-[#a09788] text-base md:text-lg flex items-center animate-pulse font-medium">
                                    <i data-lucide="refresh-cw" class="w-5 h-5 md:w-6 md:h-6 mr-2"></i> Chạm để lật thẻ
                                </p>
                            </div>

                            <!-- MẶT SAU -->
                            <div class="absolute inset-0 w-full h-full bg-[#f4f0e6] border-2 border-[#8b7967] rounded-3xl flex flex-col items-center justify-center p-6 md:p-10 backface-hidden rotate-y-180">
                                <div class="p-3 md:p-4 bg-[#e3dac9] rounded-2xl mb-6 md:mb-8">
                                    <i data-lucide="${currentBook.icon}" class="w-8 h-8 md:w-10 md:h-10 text-[#8b7967]"></i>
                                </div>
                                <h3 class="text-3xl md:text-4xl font-bold text-[#4a3b32] mb-6 md:mb-8 border-b border-[#c5beaf] pb-4 md:pb-6 w-4/5 text-center">${currentBook.name}</h3>
                                
                                <div class="space-y-4 md:space-y-5 w-full max-w-md mt-2 text-lg md:text-xl">
                                    <div class="flex justify-between items-center bg-[#fdfbf7] p-4 md:p-5 rounded-xl shadow-sm">
                                        <span class="text-[#7a6f65] text-sm md:text-base uppercase font-bold tracking-wide">Vị trí</span>
                                        <span class="font-bold text-[#4a3b32]">${currentBook.id} / 66</span>
                                    </div>
                                    <div class="flex justify-between items-center bg-[#fdfbf7] p-4 md:p-5 rounded-xl shadow-sm">
                                        <span class="text-[#7a6f65] text-sm md:text-base uppercase font-bold tracking-wide">Phần</span>
                                        <span class="font-bold text-[#4a3b32]">${currentBook.testament}</span>
                                    </div>
                                    <div class="flex justify-between items-center bg-[#fdfbf7] p-4 md:p-5 rounded-xl shadow-sm">
                                        <span class="text-[#7a6f65] text-sm md:text-base uppercase font-bold tracking-wide">Nhóm</span>
                                        <span class="font-bold text-[#8b7967]">${currentBook.group}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center justify-center space-x-6 md:space-x-10 w-full">
                        <button onclick="fcPrev(event)" class="p-5 md:p-6 bg-[#fdfbf7] border border-[#c5beaf] text-[#4a3b32] hover:bg-[#e3dac9] rounded-full transition-all shadow-md hover:shadow-lg hover:-translate-x-1">
                            <i data-lucide="chevron-left" class="w-7 h-7 md:w-8 md:h-8"></i>
                        </button>
                        <button onclick="(function(e){ e.stopPropagation(); playAudio('${currentBook.name}'); })(event)" class="p-6 md:p-8 bg-[#55463c] text-[#fdfbf7] hover:bg-[#40342c] rounded-full shadow-xl transition-all hover:scale-110 active:scale-95">
                            <i data-lucide="volume-2" class="w-8 h-8 md:w-10 md:h-10"></i>
                        </button>
                        <button onclick="fcNext(event)" class="p-5 md:p-6 bg-[#fdfbf7] border border-[#c5beaf] text-[#4a3b32] hover:bg-[#e3dac9] rounded-full transition-all shadow-md hover:shadow-lg hover:translate-x-1">
                            <i data-lucide="chevron-right" class="w-7 h-7 md:w-8 md:h-8"></i>
                        </button>
                    </div>
                </div>
            `;
        };

        // --- STREAMING_CHUNK:Main Render ---
        const render = () => {
            const app = document.getElementById('app');
            let content = '';

            const headerHTML = `
                <header class="py-6 md:py-10 px-4 text-center border-b border-[#c5beaf]/50 bg-[#dad5c9] shadow-sm mb-6 md:mb-10">
                    <h1 class="text-4xl md:text-5xl font-bold tracking-tight text-[#4a3b32]">Mục Lục Kinh Thánh</h1>
                    <p class="text-lg md:text-xl italic text-[#7a6f65] mt-2 md:mt-3">Bản Truyền Thống 1925</p>
                </header>
            `;

            if (currentView === 'home') content = getHomeHTML();
            else if (currentView === 'learn') content = getLearnHTML();
            else if (currentView === 'test') content = getTestHTML();
            else if (currentView === 'flashcard') content = getFlashcardHTML();

            app.innerHTML = headerHTML + `<main class="flex-grow flex flex-col">${content}</main>`;
            lucide.createIcons();
        };

        // Init
        render();
    </script>
</body>
</html>
