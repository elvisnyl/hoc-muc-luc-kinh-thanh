    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // CẤU HÌNH FIREBASE CHÍNH THỨC CỦA DỰ ÁN
        const VERCEL_FIREBASE_CONFIG = {
            apiKey: "AIzaSyCN1YagLboWpmOB-uU5NzgemDBzeE8XeXY",
            authDomain: "muc-luc-kinh-thanh.firebaseapp.com",
            projectId: "muc-luc-kinh-thanh",
            storageBucket: "muc-luc-kinh-thanh.firebasestorage.app",
            messagingSenderId: "961087540885",
            appId: "1:961087540885:web:5cae0b807295ce834c159c",
            measurementId: "G-9WK3JLCC03"
        }; 
        
        let parsedConfig = null;
        try {
            const configStr = typeof __firebase_config !== 'undefined' ? __firebase_config : null;
            parsedConfig = typeof configStr === 'string' ? JSON.parse(configStr) : configStr;
        } catch(e) {}
        
        const firebaseConfig = VERCEL_FIREBASE_CONFIG || parsedConfig;

        window.leaderboardData = [];
        window.firebaseUserId = null;
        window.totalLearners = 0;
        window.onlineLearners = 0;

        if (firebaseConfig) {
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);

            const initAuth = async () => {
                const token = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
                try {
                    if (token) await signInWithCustomToken(auth, token);
                    else await signInAnonymously(auth);
                    
                    if (!auth.currentUser) return;
                    window.firebaseUserId = auth.currentUser.uid;

                    const lbRef = collection(db, 'leaderboard');
                    onSnapshot(lbRef, (snapshot) => {
                        const now = Date.now();
                        window.totalLearners = snapshot.size; 
                        window.onlineLearners = 0; 

                        let data = [];
                        snapshot.forEach(d => {
                            const user = d.data();
                            const isUserOnline = user.lastActive && (now - user.lastActive < 120000);
                            
                            if (isUserOnline) {
                                window.onlineLearners++;
                            }

                            if (user.name && user.name.trim() !== '' && user.name !== 'Ẩn danh') {
                                user.isOnline = isUserOnline; 
                                data.push(user);
                            }
                        });
                        data.sort((a, b) => b.streak - a.streak);
                        window.leaderboardData = data.slice(0, 10);
                        
                        if(window.currentView === 'home' && window.renderApp) window.renderApp();
                    }, (err) => console.log("Lỗi tải Bảng xếp hạng", err));

                    window.updateCloudStreak = async (name, streak) => {
                        if(!window.firebaseUserId) return;
                        const docRef = doc(db, 'leaderboard', window.firebaseUserId);
                        // Ghi đè thông tin mới nhất và thời gian online
                        await setDoc(docRef, { name: name || 'Ẩn danh', streak: streak, lastActive: Date.now() }, { merge: true });
                    };

                    // Cập nhật nhịp tim online mỗi 45s
                    setInterval(() => {
                         if(window.firebaseUserId) {
                              window.updateCloudStreak(window.userName || 'Ẩn danh', window.bestStreak || 0);
                         }
                    }, 45000);
                    
                    // Lần đầu tải trang: báo online ngay
                    window.updateCloudStreak(window.userName || 'Ẩn danh', window.bestStreak || 0);

                } catch(e) { console.error("Firebase auth error", e); }
            };
            initAuth();
        }
    </script>

        const playAudio = (text) => {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel(); 
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'vi-VN';
            utterance.rate = 0.85; 

            const setVoiceAndSpeak = () => {
                const voices = window.speechSynthesis.getVoices();
                const viVoices = voices.filter(v => v.lang.includes('vi'));
                const southernVoice = viVoices.find(v => v.name.toLowerCase().includes('nam') || v.name.toLowerCase().includes('ho chi minh') || v.name.toLowerCase().includes('southern'));
                if (southernVoice) utterance.voice = southernVoice;
                else if (viVoices.length > 0) utterance.voice = viVoices[0];
                window.speechSynthesis.speak(utterance);
            };

            if (window.speechSynthesis.getVoices().length === 0) {
                window.speechSynthesis.addEventListener('voiceschanged', setVoiceAndSpeak, { once: true });
            } else {
                setVoiceAndSpeak();
            }
        };

        window.setView = (view) => {
            if (view !== 'home' && (!window.userName || window.userName.trim() === '')) {

                window.showNameModal = true;
                window.renderApp();
                return;
            }

            window.currentView = view;
            if (view !== 'test') { 
                window.testLevel = null; 
                window.testStreak = 0; 
                window.nextTarget = null;

            if (view !== 'flashcard') {

            // Lấy ngẫu nhiên 5 sách bất kỳ (có thể cách xa nhau)
            let shuffledPool = [...pool].sort(() => Math.random() - 0.5);
            let selected5 = shuffledPool.slice(0, 5);
            
            // Sắp xếp 5 sách này theo chuẩn ID để tạo ra đáp án đúng (từ trước ra sau)
            let correctBooks = [...selected5].sort((a, b) => a.id - b.id);
            
            window.testTargetOrder = correctBooks;
            window.testOptions = [...selected5].sort(() => Math.random() - 0.5);
            window.testSelectedOrder = [];
            window.testIsCorrect = null;
            window.testScored = false;
            window.renderApp();
        };

        const updateStreak = () => {
            if (!window.testScored) {
                window.testStreak++;
                window.testScored = true;
                if (window.testStreak > window.bestStreak) {
                    window.bestStreak = window.testStreak;
                    localStorage.setItem('bible_bestStreak', window.bestStreak.toString());
                    if (window.updateCloudStreak) window.updateCloudStreak(window.userName || 'Ẩn danh', window.bestStreak);
                }
            }
        };

        window.handleTestSelect = (bookId) => {
            if (window.testIsCorrect === true) return; 
            const book = BIBLE_BOOKS.find(b => b.id === bookId);
            if (window.testSelectedOrder.some(b => b.id === bookId)) return;
            
            window.testSelectedOrder.push(book);
            playAudio(book.name);

            if (window.testSelectedOrder.length === 5) {
                window.testIsCorrect = window.testSelectedOrder.every((b, i) => b.id === window.testTargetOrder[i].id);
                if (window.testIsCorrect) {
                    playAudio("Tuyệt vời, bạn đã làm đúng!");
                    updateStreak();
                } else {
                    playAudio("Chưa chính xác, hãy thử lại.");
                    if (!window.testScored) { window.testStreak = 0; window.testScored = true; }
                }
            }
            window.renderApp();
        };

        window.handleTestRemove = (bookId) => {
            if (window.testIsCorrect === true) return; 
            window.testSelectedOrder = window.testSelectedOrder.filter(b => b.id !== bookId);
            window.testIsCorrect = null; 
            window.renderApp();

        window.retryGame1 = () => {
            window.testSelectedOrder = [];
            window.testIsCorrect = null;

        window.startNextGame = () => {
            window.nextTarget = 'active';

        window.resetNextGame = () => {
            window.nextTarget = null;
            window.testStreak = 0;
            window.renderApp();
        };

        // --- STREAMING_CHUNK:Game 2 (6 Types Logic) ---
        window.generateNextBookQuestion = () => {
            window.nextAnswered = null;
            window.testIsCorrect = null;
            window.testScored = false;
            
            const type = Math.floor(Math.random() * 6); // 6 Dạng câu hỏi
            const promptIndex = Math.floor(Math.random() * BIBLE_BOOKS.length); 
            const promptBook = BIBLE_BOOKS[promptIndex];
            
            let questionText = "";
            let correctOption = null;
            let options = [];

            if (type === 0) {
                // Dạng 1: Sách nằm NGAY SAU
                const pIdx = Math.min(BIBLE_BOOKS.length - 2, promptIndex); 
                const correctBook = BIBLE_BOOKS[pIdx + 1];
                correctOption = { id: correctBook.id, label: correctBook.name };
                questionText = 'Sách nào nằm NGAY SAU sách này?';
                
                let wrongIndices = [];
                for (let i = Math.max(0, pIdx - 6); i <= Math.min(BIBLE_BOOKS.length - 1, pIdx + 6); i++) {
                    if (i !== pIdx && i !== pIdx + 1) wrongIndices.push(i);
                }
                wrongIndices.sort(() => Math.random() - 0.5);
                options = [correctOption];
                for (let i = 0; i < 3; i++) options.push({ id: BIBLE_BOOKS[wrongIndices[i]].id, label: BIBLE_BOOKS[wrongIndices[i]].name });
                window.nextTarget = { promptBook, questionText, correctOption };

            } else if (type === 1) {
                // Dạng 2: Sách nằm NGAY TRƯỚC
                const pIdx = Math.max(1, promptIndex); 
                const correctBook = BIBLE_BOOKS[pIdx - 1];
                correctOption = { id: correctBook.id, label: correctBook.name };
                questionText = 'Sách nào nằm NGAY TRƯỚC sách này?';
                
                let wrongIndices = [];
                for (let i = Math.max(0, pIdx - 6); i <= Math.min(BIBLE_BOOKS.length - 1, pIdx + 6); i++) {
                    if (i !== pIdx && i !== pIdx - 1) wrongIndices.push(i);
                }
                wrongIndices.sort(() => Math.random() - 0.5);
                options = [correctOption];
                for (let i = 0; i < 3; i++) options.push({ id: BIBLE_BOOKS[wrongIndices[i]].id, label: BIBLE_BOOKS[wrongIndices[i]].name });
                window.nextTarget = { promptBook, questionText, correctOption };

            } else if (type === 2) {
                // Dạng 3: Thuộc nhóm nào?
                correctOption = { id: promptBook.group, label: promptBook.group };
                questionText = 'Sách này thuộc NHÓM SÁCH nào?';
                
                let allGroups = [...new Set(BIBLE_BOOKS.map(b => b.group))];
                let wrongGroups = allGroups.filter(g => g !== promptBook.group).sort(() => Math.random() - 0.5);
                
                options = [correctOption];
                for (let i = 0; i < 3; i++) options.push({ id: wrongGroups[i], label: wrongGroups[i] });
                window.nextTarget = { promptBook, questionText, correctOption };

            } else if (type === 3) {
                // Dạng 4: CỰU ƯỚC hay TÂN ƯỚC?
                correctOption = { id: promptBook.testament, label: promptBook.testament };
                questionText = 'Sách này thuộc phần CỰU ƯỚC hay TÂN ƯỚC?';
                
                options = [
                    { id: 'Cựu Ước', label: 'Cựu Ước' },
                    { id: 'Tân Ước', label: 'Tân Ước' }
                ];
                window.nextTarget = { promptBook, questionText, correctOption };

            } else if (type === 4) {
                // Dạng 5: Tác giả là AI?
                correctOption = { id: promptBook.author, label: promptBook.author };
                questionText = 'Sách này do AI VIẾT (Tác giả)?';
                
                let allAuthors = [...new Set(BIBLE_BOOKS.map(b => b.author))];
                let wrongAuthors = allAuthors.filter(a => a !== promptBook.author).sort(() => Math.random() - 0.5);
                
                options = [correctOption];
                let numWrong = Math.min(3, wrongAuthors.length);
                for (let i = 0; i < numWrong; i++) options.push({ id: wrongAuthors[i], label: wrongAuthors[i] });
                window.nextTarget = { promptBook, questionText, correctOption };
                
            } else {
                // Dạng 6: Sách nào nằm GIỮA 2 sách này?
                const pIdx = Math.max(1, Math.min(BIBLE_BOOKS.length - 2, promptIndex)); // Đảm bảo luôn có sách trước và sau
                const correctBook = BIBLE_BOOKS[pIdx];
                const bookBefore = BIBLE_BOOKS[pIdx - 1];
                const bookAfter = BIBLE_BOOKS[pIdx + 1];
                
                correctOption = { id: correctBook.id, label: correctBook.name };
                questionText = 'Sách nào nằm GIỮA 2 sách này?';
                
                // Tạo một sách "giả" để hiển thị ra UI

                let wrongIndices = [];
                for (let i = Math.max(0, pIdx - 6); i < Math.min(BIBLE_BOOKS.length, pIdx + 6); i++) {
                    if (i !== pIdx && i !== pIdx - 1 && i !== pIdx + 1) wrongIndices.push(i);
                }
                wrongIndices.sort(() => Math.random() - 0.5);
                options = [correctOption];
                for (let i = 0; i < 3; i++) options.push({ id: BIBLE_BOOKS[wrongIndices[i]].id, label: BIBLE_BOOKS[wrongIndices[i]].name });
                
                window.nextTarget = { promptBook: displayBook, questionText, correctOption };
            }
            
            window.nextOptions = options.sort(() => Math.random() - 0.5);
            window.renderApp();
        };

        const getFlashcardHTML = () => {
            const books = window.fcFilter === 'ALL' ? BIBLE_BOOKS : BIBLE_BOOKS.filter(b => b.testament === (window.fcFilter === 'OT' ? 'Cựu Ước' : 'Tân Ước'));
            const currentBook = books[window.fcIndex];
            const BookIcon = currentBook?.icon || 'scroll';

            return `
                <div class="fade-in max-w-2xl mx-auto flex flex-col items-center px-4 w-full">
                    <div class="w-full flex flex-col sm:flex-row items-center justify-between mb-8 gap-4 pt-2">
                        <button onclick="window.setView('home')" class="flex items-center text-[#1a1a1a] hover:text-[#0085ff] transition-colors text-lg font-bold uppercase">
                            <i data-lucide="arrow-left" class="w-5 h-5 mr-2"></i> Trở về
                        </button>
                        
                        <div class="flex space-x-2 bg-white p-1.5 rounded-2xl shadow-sm">
                            ${[{id: 'ALL', n: 'Tất cả'}, {id: 'OT', n: 'Cựu Ước'}, {id: 'NT', n: 'Tân Ước'}].map(f => `
                                <button onclick="window.fcFilter = '${f.id}'; window.fcIndex = 0; window.fcIsFlipped = false; window.renderApp();" class="px-5 py-2 text-sm md:text-base rounded-xl font-bold transition-all uppercase ${window.fcFilter === f.id ? 'bg-[#1a1a1a] text-white' : 'text-[#666] hover:text-[#1a1a1a] hover:bg-gray-100'}">
                                    ${f.n}
                                </button>
                            `).join('')}
                        </div>
                    </div>

                    <div class="text-sm md:text-base font-bold text-[#1a1a1a] mb-6 tracking-widest uppercase bg-white px-6 py-2 rounded-full shadow-sm">
                        Thẻ ${window.fcIndex + 1} / ${books.length}
                    </div>

                    <div onclick="window.fcFlip()" class="w-full h-[450px] md:h-[500px] cursor-pointer mb-8 relative perspective-1000">
                        <div class="absolute inset-0 w-full h-full transition-all duration-500 ease-in-out">
                            <!-- FRONT -->
                            <div class="absolute w-full h-full bg-white rounded-[2rem] flex flex-col items-center justify-center p-8 transition-opacity duration-300 shadow-md ${window.fcIsFlipped ? 'opacity-0 pointer-events-none' : 'opacity-100 z-10'}">
                                <div class="w-24 h-24 bg-[#e6f3ff] rounded-full flex items-center justify-center mb-8">
                                     <i data-lucide="${BookIcon}" class="w-12 h-12 text-[#0085ff]"></i>
                                </div>
                                <h2 class="text-4xl md:text-6xl font-bold text-[#1a1a1a] text-center px-4 leading-tight uppercase">${currentBook?.name || ''}</h2>
                                <p class="mt-8 text-[#aaa] font-semibold tracking-widest uppercase text-sm animate-pulse">Chạm để lật thẻ</p>
                            </div>

                            <!-- BACK -->
                            <div class="absolute w-full h-full bg-white rounded-[2rem] flex flex-col items-center p-6 md:p-8 transition-opacity duration-300 shadow-md ${!window.fcIsFlipped ? 'opacity-0 pointer-events-none' : 'opacity-100 z-20'} overflow-hidden">
                                
                                <div class="flex flex-col items-center w-full mb-6 shrink-0">
                                    <div class="p-3 bg-[#fff0f0] rounded-full mb-4 shrink-0 text-[#ff2a2a]">
                                        <i data-lucide="${BookIcon}" class="w-6 h-6"></i>
                                    </div>
                                    <h3 class="text-3xl md:text-4xl font-bold text-[#1a1a1a] text-center mb-2 uppercase">${currentBook?.name || ''}</h3>
                                    <div class="flex justify-center items-center space-x-4 text-xs font-bold uppercase tracking-widest">
                                        <span class="text-[#0085ff] bg-[#e6f3ff] px-3 py-1 rounded-full">${currentBook?.group}</span>
                                        <span class="text-[#1a1a1a] bg-gray-100 px-3 py-1 rounded-full">Quyển ${currentBook?.id}/66</span>
                                    </div>
                                </div>
                                
                                <div class="w-[80%] h-[1px] bg-gray-200 mb-6 shrink-0"></div>
                                
                                <div class="w-full flex-grow overflow-y-auto custom-scrollbar px-2 md:px-6 space-y-5 text-left pb-2">
                                    <div>
                                        <span class="text-[#888] uppercase text-[10px] font-bold tracking-wider block mb-1">Tác giả</span>
                                        <span class="text-[#1a1a1a] font-bold text-lg uppercase">${currentBook?.author}</span>
                                    </div>
                                    
                                    <div>
                                        <span class="text-[#888] uppercase text-[10px] font-bold tracking-wider block mb-1">Thời gian viết</span>
                                        <span class="text-[#1a1a1a] font-bold text-lg uppercase">${currentBook?.year}</span>
                                    </div>
                                    
                                    <div>
                                        <span class="text-[#888] uppercase text-[10px] font-bold tracking-wider block mb-2">Tóm tắt nội dung</span>
                                        <p class="text-[#1a1a1a] font-medium text-base md:text-lg leading-relaxed bg-gray-50 p-4 rounded-2xl border border-gray-100">${currentBook?.summary}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center justify-center space-x-6 w-full pb-10">
                        <button onclick="window.fcPrev(event)" class="p-5 bg-white text-[#1a1a1a] hover:bg-[#e5e7eb] rounded-full transition-all shadow-sm">
                            <i data-lucide="chevron-left" class="w-8 h-8"></i>
                        </button>
                        <button onclick="(function(e){ e.stopPropagation(); playAudio('${currentBook?.name || ''}'); })(event)" class="p-6 bg-[#1a1a1a] text-white hover:bg-[#ffaa00] hover:text-[#1a1a1a] rounded-full transition-all hover:scale-105 active:scale-95 shadow-md">
                            <i data-lucide="volume-2" class="w-8 h-8 md:w-10 md:h-10"></i>
                        </button>
                        <button onclick="window.fcNext(event)" class="p-5 bg-white text-[#1a1a1a] hover:bg-[#e5e7eb] rounded-full transition-all shadow-sm">
                            <i data-lucide="chevron-right" class="w-8 h-8"></i>
                        </button>
                    </div>
                </div>
            `;
        };

        // --- STREAMING_CHUNK:App Entry Point ---
        window.renderApp = () => {
            const app = document.getElementById('app');
            const headerHTML = `
                <header class="pt-10 pb-6 px-4 text-center">
                    <img src="https://i.ibb.co/PZdQs4mF/LOGO.png" alt="Logo" class="h-16 md:h-20 mx-auto mb-4 object-contain cursor-pointer transition-transform hover:scale-105" onclick="window.setView('home')" />
                    <h1 class="text-4xl md:text-6xl font-bold tracking-tight text-[#1a1a1a] uppercase leading-none">Mục Lục Kinh Thánh</h1>
                    <p class="mt-3 text-lg font-medium text-[#666] italic">Cùng nhau học thuộc mục lục Kinh Thánh</p>
                </header>
            `;
            
            let content = '';
            if (window.currentView === 'home') content = getHomeHTML();
            else if (window.currentView === 'learn') content = getLearnHTML();
            else if (window.currentView === 'test') content = getTestHTML();
            else if (window.currentView === 'flashcard') content = getFlashcardHTML();

            let modalHTML = '';
            if (window.showNameModal) {
                modalHTML = `
                <div class="fixed inset-0 z-[100] flex items-center justify-center bg-black/60 backdrop-blur-sm fade-in px-4">
                    <div class="bg-white rounded-3xl p-6 md:p-8 max-w-sm w-full text-center shadow-2xl">
                        <div class="w-16 h-16 bg-[#ffaa00]/20 text-[#ffaa00] rounded-full flex items-center justify-center mx-auto mb-4">
                            <i data-lucide="user" class="w-8 h-8"></i>
                        </div>
                        <h3 class="text-2xl font-bold text-[#1a1a1a] mb-2 uppercase">Bạn tên là gì?</h3>
                        <p class="text-[#666] text-sm mb-6 font-medium">Vui lòng nhập tên để lưu kỷ lục của bạn lên bảng xếp hạng trước khi bắt đầu.</p>
                        
                        <input type="text" id="modal-name-input" placeholder="Nhập tên..." class="w-full text-center px-4 py-3 bg-gray-100 rounded-2xl text-lg font-bold text-[#1a1a1a] focus:outline-none focus:ring-4 focus:ring-[#ffaa00]/30 transition-all border-2 border-transparent focus:border-[#ffaa00]/50 mb-6" onkeydown="if(event.key === 'Enter') window.submitNameModal()" />
                        
                        <div class="flex gap-3">
                            <button onclick="window.closeNameModal()" class="flex-1 px-4 py-3 bg-gray-100 hover:bg-gray-200 text-[#1a1a1a] rounded-2xl font-bold uppercase transition-all">Hủy</button>
                            <button onclick="window.submitNameModal()" class="flex-1 px-4 py-3 bg-[#1a1a1a] hover:bg-[#ffaa00] hover:text-[#1a1a1a] text-white rounded-2xl font-bold uppercase transition-all shadow-md">Bắt đầu</button>
                        </div>
                    </div>
                </div>
                `;
            }

            app.innerHTML = headerHTML + `<main class="flex-grow flex flex-col items-center w-full">${content}</main>` + modalHTML;
            lucide.createIcons();

            if (window.showNameModal) {
                const input = document.getElementById('modal-name-input');
                if (input) input.focus();
            }
        };

        window.renderApp(); 
    </script>
</body>
</html>
